<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-labelledby="t d"><title id="t">The two data laws: UK GDPR and the Computer Misuse Act</title><desc id="d">Left: UK GDPR with the Data Protection Act 2018 sets the rules for handling personal data. Collect it with a lawful basis and only what you need (data minimisation). Use it fairly and openly, and only for the stated purpose (purpose limitation). Store it accurately and not for too long (storage limitation). Protect it (integrity and confidentiality). It is enforced by the ICO, with fines up to 17.5 million pounds or 4% of turnover. Right: the Computer Misuse Act 1990 makes breaking in a crime. An attacker getting into an organisation&#x27;s system without permission commits a criminal offence: unauthorised access, access to commit a further crime, impairing a computer or data, or making or supplying hacking tools. The organisation must take due care to stop unauthorised access, for example MFA, patching and disabling leavers&#x27; accounts.</desc><style>
.bg{fill:#ffffff}
.t{font:600 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.tb{font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#12202b}
.s{font:500 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#5b6a78}
.m{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:#12202b}
.h{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#0a6b84;letter-spacing:.08em}
.w{fill:#ffffff}
.box{fill:#f3f8fa;stroke:#a9bfca;stroke-width:1.5}
.acc{fill:#e3f1f5;stroke:#0a6b84;stroke-width:1.5}
.bad{fill:#fbe5e3;stroke:#b3302b;stroke-width:1.5}
.good{fill:#e1f3e8;stroke:#1d7a45;stroke-width:1.5}
.amb{fill:#fbf0dc;stroke:#a8650a;stroke-width:1.5}
.dim{fill:#eef2f4;stroke:#c9d3da;stroke-width:1.5}
.solid-acc{fill:#0a6b84}.solid-bad{fill:#b3302b}.solid-good{fill:#1d7a45}.solid-amb{fill:#a8650a}.solid-ink{fill:#12202b}
.ln{stroke:#5b6a78;stroke-width:2;fill:none}
.ln-acc{stroke:#0a6b84;stroke-width:2.2;fill:none}
.ln-bad{stroke:#b3302b;stroke-width:2.2;fill:none}
.ln-good{stroke:#1d7a45;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5}
.tx-acc{fill:#0a6b84}.tx-bad{fill:#b3302b}.tx-good{fill:#1d7a45}.tx-amb{fill:#a8650a}
.ic{fill:none;stroke:#12202b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-bad{fill:none;stroke:#b3302b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-acc{fill:none;stroke:#0a6b84;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-ln{fill:#5b6a78}.mk-acc{fill:#0a6b84}.mk-bad{fill:#b3302b}.mk-good{fill:#1d7a45}
@media (prefers-color-scheme: dark){
.bg{fill:#15202a}
.t,.tb,.m{fill:#e6edf3}.s{fill:#98a8b6}.h{fill:#4fb6cf}
.box{fill:#192632;stroke:#3a4c5a}.acc{fill:#143440;stroke:#4fb6cf}.bad{fill:#3c1d1b;stroke:#ef7c76}
.good{fill:#15352a;stroke:#5cc98a}.amb{fill:#392b13;stroke:#e2a645}.dim{fill:#1b2833;stroke:#34444f}
.solid-acc{fill:#2f8fa8}.solid-bad{fill:#c9534d}.solid-good{fill:#2f9a5f}.solid-amb{fill:#b97c1e}.solid-ink{fill:#e6edf3}
.ln{stroke:#98a8b6}.ln-acc{stroke:#4fb6cf}.ln-bad{stroke:#ef7c76}.ln-good{stroke:#5cc98a}
.tx-acc{fill:#4fb6cf}.tx-bad{fill:#ef7c76}.tx-good{fill:#5cc98a}.tx-amb{fill:#e2a645}
.ic{stroke:#e6edf3}.ic-bad{stroke:#ef7c76}.ic-acc{stroke:#4fb6cf}
.mk-ln{fill:#98a8b6}.mk-acc{fill:#4fb6cf}.mk-bad{fill:#ef7c76}.mk-good{fill:#5cc98a}
}
</style><defs><marker id="a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-ln"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-acc"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-bad"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk-good"/></marker></defs><rect class="bg" width="760" height="296" rx="16"/><text x="24" y="32" class="h" text-anchor="start">UK GDPR + DPA 2018: HANDLING DATA</text><rect x="24" y="50" width="164" height="80" rx="10" class="acc"/><text x="106" y="78" class="tb" text-anchor="middle">Collect</text><text x="106" y="100" class="s" text-anchor="middle">lawful basis</text><text x="106" y="117" class="s" text-anchor="middle">data minimisation</text><rect x="200" y="50" width="164" height="80" rx="10" class="acc"/><text x="282" y="78" class="tb" text-anchor="middle">Use</text><text x="282" y="100" class="s" text-anchor="middle">fair and transparent</text><text x="282" y="117" class="s" text-anchor="middle">purpose limitation</text><rect x="24" y="142" width="164" height="80" rx="10" class="acc"/><text x="106" y="170" class="tb" text-anchor="middle">Store</text><text x="106" y="192" class="s" text-anchor="middle">accuracy</text><text x="106" y="209" class="s" text-anchor="middle">storage limitation</text><rect x="200" y="142" width="164" height="80" rx="10" class="acc"/><text x="282" y="170" class="tb" text-anchor="middle">Protect</text><text x="282" y="192" class="s" text-anchor="middle">integrity and</text><text x="282" y="209" class="s" text-anchor="middle">confidentiality</text><text x="194" y="254" class="s" text-anchor="middle">Enforced by the ICO: fines up to</text><text x="194" y="272" class="s" text-anchor="middle">£17.5m or 4% of turnover</text><path d="M390 20 V286" class="ln dash"/><text x="412" y="32" class="h" text-anchor="start">COMPUTER MISUSE ACT 1990: BREAKING IN</text><circle cx="450" cy="86" r="7" class="ic-bad"/><path d="M438 110 q0 -14 12 -14 q12 0 12 14" class="ic-bad"/><text x="450" y="134" class="s" text-anchor="middle">Attacker</text><rect x="616" y="56" width="120" height="86" rx="10" class="box"/><rect x="641" y="79" width="30" height="10" rx="2" class="ic"/><circle cx="647" cy="84" r="1.4" class="ic"/><rect x="641" y="91" width="30" height="10" rx="2" class="ic"/><circle cx="647" cy="96" r="1.4" class="ic"/><rect x="641" y="103" width="30" height="10" rx="2" class="ic"/><circle cx="647" cy="108" r="1.4" class="ic"/><rect x="695" y="89" width="18" height="14" rx="3" class="ic-acc"/><path d="M699 89 v-5 a5 5 0 0 1 10 0 v5" class="ic-acc"/><text x="676" y="134" class="s" text-anchor="middle">Organisation</text><path d="M476 92 L610 92" class="ln-bad dash" marker-end="url(#a-bad)"/><circle cx="543" cy="92" r="11" class="bad"/><path d="M538.5 87.5 l9 9 M547.5 87.5 l-9 9" class="ln-bad"/><text x="543" y="70" class="s" text-anchor="middle">no permission</text><rect x="412" y="160" width="324" height="50" rx="10" class="bad"/><text x="574" y="181" class="t" text-anchor="middle">Attacker: a criminal offence</text><text x="574" y="199" class="s" text-anchor="middle">access · further crime · impair · tools</text><rect x="412" y="220" width="324" height="56" rx="10" class="good"/><text x="574" y="242" class="t" text-anchor="middle">Organisation: must take due care</text><text x="574" y="262" class="s" text-anchor="middle">MFA, patching, disable leavers&#x27; accounts</text></svg>
